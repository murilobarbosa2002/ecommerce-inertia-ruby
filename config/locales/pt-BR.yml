# Conteúdo real do produto (model, formulário, e-mail, página) — separado do
# texto de ferramentas de linha de comando (config/locales/cli.pt-BR.yml) de
# propósito. Ver docs/adr/0014-i18n-default-locale-and-content-separation.md.
pt-BR:
  activerecord:
    attributes:
      admin:
        email_address: "E-mail"
        password: "Senha"
        password_confirmation: "Confirmação de senha"
  # has_secure_password usa esta chave (fora do namespace activerecord, igual
  # ao Rails: lib/active_model/locale/en.yml) pro erro de senha maior que os
  # 72 bytes aceitos pelo bcrypt. rails-i18n ainda não traduz essa chave
  # específica pra pt-BR (achado real: sem isso, aparecia como "Translation
  # missing" pro admin em vez de uma mensagem legível).
  errors:
    messages:
      password_too_long: "é muito longa"
  admin:
    sessions:
      create:
        invalid_credentials: "E-mail ou senha inválidos"
    passwords:
      create:
        instructions_sent: "Se esse e-mail existir, enviamos instruções de redefinição de senha"
      edit:
        invalid_or_expired: "Link de redefinição de senha inválido ou expirado"
      update:
        success: "Senha redefinida com sucesso"
        failure: "Não foi possível redefinir a senha"
  admin_panel:
    passwords_mailer:
      reset:
        subject: "Redefinição de senha"
        intro: "Você pode redefinir sua senha em"
        link_text: "esta página de redefinição de senha"
        expires_in: "Este link expira em %{duration}."
