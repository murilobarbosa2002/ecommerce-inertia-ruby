name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      # Active Record Encryption (otp_secret do 2FA, docs/adr/0013) precisa
      # decriptar config/credentials.yml.enc em runtime, mesmo em teste.
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "12.16.1"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.2"
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium (specs de sistema via Cuprite)
        run: sudo apt-get update && sudo apt-get install -y chromium-browser

      - name: Generate js-routes (app/frontend/routes.js + routes.d.ts)
        run: bin/rails js:routes

      - name: Prepare test database
        run: bin/rails db:test:prepare

      - name: Run RSpec
        run: bundle exec rspec

  js:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      # js-routes (docs/adr/0018) gera app/frontend/routes.js/routes.d.ts a
      # partir de config/routes.rb — precisa carregar o ambiente Rails
      # (:environment), que decripta credentials.yml.enc no boot (Active
      # Record Encryption, docs/adr/0013), mesmo sem conexão de banco.
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "12.16.1"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.2"
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate js-routes (app/frontend/routes.js + routes.d.ts)
        run: bin/rails js:routes

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Check formatting (Prettier)
        run: pnpm format:check

      - name: Type check (TypeScript)
        run: pnpm run check

      - name: Run Vitest
        run: pnpm test

      - name: Build (Vite)
        run: pnpm exec vite build

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: "**/*.md"
